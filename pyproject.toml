[build-system]
requires = ["setuptools>=42","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cocyclenet"
version = "0.1.0"
description = "CocycleNet for learning dynamical systems"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas==1.5.3",
    "scikit-learn==1.2.2",
    "numpy==1.23.5",
    "matplotlib==3.7.0",
    "torch==2.0.1",
    "pytorch-lightning>=2.0.0",
]
